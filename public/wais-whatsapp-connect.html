<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W.A.I.S WhatsApp Connect</title><style>body{margin:0;background:#071b12;color:#fff;font-family:Arial;display:grid;place-items:center;min-height:100vh}.card{width:min(92vw,520px);padding:28px;border:1px solid #d4af37;border-radius:22px;background:#0b2619;text-align:center}h1{color:#ffff00}#qr{width:360px;max-width:90%;display:none;margin:18px auto;background:#fff;border-radius:12px}button{padding:12px 22px;border:0;border-radius:999px;background:#00c853;font-weight:800}small{display:block;color:#a9c3b5;margin-top:18px}</style></head><body><main class="card"><h1>W.A.I.S</h1><p>WhatsApp AI Space — connection console</p><div id="status">Starting bridge…</div><img id="qr" alt="WhatsApp QR code"><button onclick="refresh()">Refresh</button><small>In WhatsApp: Settings → Linked devices → Link a device → scan this QR.</small></main><script>async function refresh(){try{const s=await fetch('/api/whatsapp/status',{cache:'no-store'}).then(r=>r.json());document.getElementById('status').textContent='Bridge: '+s.status+(s.lastError?' — '+s.lastError:'');const q=document.getElementById('qr');if(s.qr){q.src=s.qr;q.style.display='block'}else if(s.status==='qr_ready'){q.src='/api/whatsapp/qr?'+Date.now();q.style.display='block'}else q.style.display='none'}catch(e){document.getElementById('status').textContent='Bridge check failed'}}refresh();setInterval(refresh,3000)</script></body></html>
