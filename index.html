
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach AI OS</title>
<style>
body{background:#0f172a;color:white;font-family:sans-serif;padding:20px;max-width:600px;margin:auto}
input{width:100%;padding:12px;margin:8px 0 16px 0;border-radius:8px;border:1px solid #334155;background:#1e293b;color:white;box-sizing:border-box}
button{background:#6366f1;color:white;padding:14px;border:none;border-radius:10px;width:100%;font-weight:bold;font-size:16px}
#result{margin-top:20px;background:#1e293b;padding:16px;border-radius:10px;white-space:pre-wrap;line-height:1.6;display:none}
.key-box{background:#1e293b;border:1px dashed #6366f1;padding:12px;border-radius:10px;margin-bottom:20px}
</style>
</head>
<body>
<h1>🤖 Coach AI OS</h1>
<p style="color:#94a3b8">Create a structured coaching program powered by AI.</p>

<div class="key-box">
<label><b>🔑 Gemini API Key (FREE)</b></label>
<input id="apiKey" type="password" placeholder="Paste Gemini API Key here (AIza...)">
<small>Get free key at: aistudio.google.com/app/apikey</small>
</div>

<label>Coaching niche</label>
<input id="niche" placeholder="Life Coach, Fitness" value="Life Coach">

<label>Student goal</label>
<input id="goal" value="Understand AI world">

<label>Program length (days)</label>
<input id="length" type="number" value="21">

<button id="genBtn" onclick="generate()">Generate Program</button>
<div id="result"></div>

<script>
const apiInput=document.getElementById('apiKey');
const saved=localStorage.getItem('gemini_key');
if(saved){apiInput.value=saved;}
apiInput.addEventListener('change',()=>{localStorage.setItem('gemini_key',apiInput.value.trim());});

async function generate(){
 const key=document.getElementById('apiKey').value.trim();
 const niche=document.getElementById('niche').value.trim();
 const goal=document.getElementById('goal').value.trim();
 const length=document.getElementById('length').value.trim();
 const resultDiv=document.getElementById('result');
 const btn=document.getElementById('genBtn');
 if(!key){alert('Paste Gemini API Key first! Get it at aistudio.google.com');return;}
 localStorage.setItem('gemini_key',key);
 btn.disabled=true;btn.innerText='Generating...';
 resultDiv.style.display='block';
 resultDiv.innerText='⏳ Creating your '+length+' day program...';
 const prompt=`You are Coach AI OS. Create a structured ${length}-day coaching program. Niche: ${niche}. Student Goal: ${goal}. Format: Day 1, Day 2 etc with Title, Task, Motivation. Simple English.`;
 try{
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
  const data=await res.json();
  if(data.error){resultDiv.innerText='❌ Error: '+data.error.message;}
  else{resultDiv.innerText=data.candidates?.[0]?.content?.parts?.[0]?.text||'No response';}
 }catch(e){resultDiv.innerText='❌ Failed: '+e.message;}
 btn.disabled=false;btn.innerText='Generate Program';
}
</script>
</body> 
</html>
