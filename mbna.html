<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBNA</title><style>body{font-family:sans-serif;background:#0a0a0a;color:#fff;margin:0}.wrap{max-width:800px;margin:0 auto;padding:20px}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#111;color:#fff}button{padding:14px 24px;background:#ffaa00;border:0;border-radius:8px;font-weight:700;width:100%;margin-top:10px}.day{background:#111;border:1px solid #222;padding:15px;border-radius:10px;margin:10px 0}</style></head><body><div class="wrap"><div style="display:flex;justify-content:space-between"><h2>MBNA Builder</h2><a href="/" style="color:#888">Home</a></div><input id="niche" placeholder="Niche e.g. Business Coach"><input id="goal" placeholder="Goal e.g. 10k Instagram"><input id="days" type="number" placeholder="Days" value="21"><button onclick="gen()">Generate Program</button><div id="out" style="margin-top:20px"></div></div><script>async function gen(){const n=document.getElementById('niche').value,g=document.getElementById('goal').value,dy=document.getElementById('days').value;if(!n||!g)return alert('Fill niche+goal');document.getElementById('out').innerHTML='Generating...';try{const r=await fetch('/api/mbna/program',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({niche:n,goal:g,days:dy})});const d=await r.json();if(!d.success){document.getElementById('out').innerHTML=d.error;return}let h='<h3>'+d.program.title+'</h3><p>'+d.program.goal+'</p>';d.program.days.forEach(day=>{h+='<div class=day><b>Day '+day.day+'</b><div>Lesson:'+day.lesson+'</div><div style=color:#ffaa00>Action:'+day.action+'</div></div>'});document.getElementById('out').innerHTML=h}catch{document.getElementById('out').innerHTML='Failed'}}</script></body></html>
