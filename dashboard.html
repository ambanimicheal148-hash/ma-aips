<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MA-AIPS Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #020617;
      color: #f8fafc;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: min(700px, 92%);
      padding: 32px 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    a {
      display: inline-block;
      padding: 14px 20px;
      border-radius: 10px;
      background: #6366f1;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      opacity: 0.9;
    }

    .status {
      margin-top: 28px;
      padding: 16px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #0f172a;
    }

    #apiStatus {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main>

    <h1>MA-AIPS Dashboard</h1>

    <p>
      Autonomous Intelligence Platform
    </p>

    <div class="actions">

      <a href="/student.html?student_id=TEST123">
        Open AI Coach
      </a>

      <a href="/api/health">
        Check API
      </a>

    </div>

    <div class="status">

      <p>
        Platform status:
        <span id="apiStatus">
          Checking...
        </span>
      </p>

    </div>

  </main>

  <script>
    async function checkAPI() {
      const status = document.getElementById("apiStatus");

      try {
        const response = await fetch("/api/health");

        if (!response.ok) {
          throw new Error("API unavailable");
        }

        const data = await response.json();

        if (data?.status === "ok") {
          status.textContent = "Online";
        } else {
          status.textContent = "Available";
        }
      } catch (error) {
        status.textContent = "Unavailable";
      }
    }

    checkAPI();
  </script>

</body>
</html>
