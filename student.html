<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your AI Coach</title>
<style>
body{background:#0f172a;color:white;font-family:sans-serif;padding:15px}
#chat{height:65vh;overflow-y:auto;background:#1e293b;padding:10px;border-radius:10px}
.msg{margin:10px 0;padding:8px 12px;border-radius:10px;background:#334155}
.user{text-align:right;color:#c7d2fe;background:#4338ca;margin-left:30px}
.ai{background:#1f2937}
#chatForm{display:flex;gap:8px;margin-top:10px;position:sticky;bottom:0}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #334155;background:#111827;color:white}
button{background:#6366f1;color:white;border:0;padding:12px 18px;border-radius:10px;font-weight:bold}
button:disabled{opacity:.5}
</style>
</head>
<body>
<h2 id="heading">Your AI Coach</h2>
<div id="chat"></div>
<form id="chatForm">
<input id="input" maxlength="4000" placeholder="Ask your coach anything..." autocomplete="off">
<button id="sendBtn" type="submit">Send</button>
</form>
<script>
const params = new URLSearchParams(location.search);
const studentId = params.get("student_id") || params.get("id");
const chatBox = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const form = document.getElementById("chatForm");
const heading = document.getElementById("heading");

function addMessage(who, text, cls){
  const div = document.createElement("div");
  div.className = "msg " + (cls||"");
  div.textContent = who + ": " + text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function loadStudent(){
  if(!studentId){
    addMessage("System", "Open this page with ?student_id=YOUR_ID e.g. ?student_id=TEST123");
    return;
  }
  addMessage("System", "Loading student " + studentId + "...");
  try{
    // Try both APIs - with s and without s
    let res = await fetch(`/api/students/${studentId}`);
    if(!res.ok){
      res = await fetch(`/api/student?id=${studentId}`);
    }
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || "Failed to load");
    const name = data.student?.name || data.name || studentId;
    heading.textContent = `Hi ${name} - Your AI Coach`;
    addMessage("AI", `Welcome ${name}! Ask me anything.`);
    input.focus();
  }catch(err){
    addMessage("System", "Loaded as guest: " + err.message);
    heading.textContent = `AI Coach - ${studentId}`;
  }
}

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  const message = input.value.trim();
  if(!message) return;
  if(!studentId){
    addMessage("System", "Need student_id in URL");
    return;
  }
  input.value = "";
  addMessage("You", message, "user");
  sendBtn.disabled = true;
  try{
    const res = await fetch("/api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ student_id: studentId, message: message })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || "Chat failed");
    addMessage("AI", data.reply, "ai");
  }catch(err){
    addMessage("System", err.message);
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
});

loadStudent();
</script>
</body>
</html>
