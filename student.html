<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MA-AIPS AI Student Coach">
  <title>MA-AIPS AI Coach</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      border-bottom: 1px solid #1e293b;
      background: #111827;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      color: #94a3b8;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 16px;
    }

    #chat {
      min-height: 65vh;
      max-height: 70vh;
      overflow-y: auto;
      padding: 10px;
      border-radius: 14px;
      background: #111827;
      border: 1px solid #1e293b;
    }

    .message {
      margin: 12px 0;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      margin-left: 30px;
      background: #4338ca;
    }

    .ai {
      margin-right: 30px;
      background: #1e293b;
    }

    .system {
      background: #172033;
      color: #94a3b8;
      font-size: 13px;
    }

    form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #020617;
      color: #fff;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #6366f1;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      background: #6366f1;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 8px;
      color: #64748b;
      font-size: 12px;
      text-align: center;
    }
  </style></head><body><header>
  <h1 id="heading">MA-AIPS AI Coach</h1>
  <p id="studentInfo">Autonomous Intelligence Platform</p>
</header><main>
  <div id="chat"></div>  <form id="chatForm">
    <input
      id="input"
      type="text"
      maxlength="4000"
      autocomplete="off"
      placeholder="Ask MA-AIPS anything..."
    ><button id="sendBtn" type="submit">
  Send
</button>

  </form>  <div class="status" id="status">
    Ready
  </div>
</main><script>
  const params = new URLSearchParams(window.location.search);

  const studentId =
    (params.get("student_id") ||
     params.get("id") ||
     "GUEST").trim();

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const form = document.getElementById("chatForm");
  const heading = document.getElementById("heading");
  const studentInfo = document.getElementById("studentInfo");
  const status = document.getElementById("status");

  const history = [];

  function addMessage(role, text) {
    const div = document.createElement("div");

    div.className = `message ${role}`;

    const label =
      role === "user"
        ? "You"
        : role === "ai"
        ? "MA-AIPS"
        : "System";

    div.textContent = `${label}: ${text}`;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function loadStudent() {
    if (studentId === "GUEST") {
      studentInfo.textContent = "Guest mode";

      addMessage(
        "system",
        "Guest mode is active. Add ?student_id=YOUR_ID to identify a student."
      );

      return;
    }

    try {
      const response = await fetch(
        `/api/student?student_id=${encodeURIComponent(studentId)}`
      );

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.error || "Unable to load student."
        );
      }

      const student = data.student;

      heading.textContent =
        `Hi ${student.name} — MA-AIPS`;

      studentInfo.textContent =
        `Student ID: ${student.student_id} • ${student.course}`;

      addMessage(
        "ai",
        `Welcome ${student.name}! I'm your MA-AIPS AI Coach. How can I help you today?`
      );

    } catch (error) {

      studentInfo.textContent =
        `Student ID: ${studentId}`;

      addMessage(
        "system",
        `Student information could not be loaded: ${error.message}`
      );
    }
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();

    const message = input.value.trim();

    if (!message || sendBtn.disabled) {
      return;
    }

    input.value = "";

    addMessage("user", message);

    const priorHistory =
      history.slice(-12);

    history.push({
      role: "user",
      content: message
    });

    sendBtn.disabled = true;
    input.disabled = true;

    status.textContent =
      "MA-AIPS is thinking...";

    try {

      const response = await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            student_id: studentId,
            message: message,
            history: priorHistory
          })
        }
      );

      const data =
        await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.error || "AI request failed."
        );
      }

      const reply =
        data.reply || "No response received.";

      addMessage("ai", reply);

      history.push({
        role: "assistant",
        content: reply
      });

      status.textContent = "Ready";

    } catch (error) {

      addMessage(
        "system",
        `AI error: ${error.message}`
      );

      status.textContent = "Error";

    } finally {

      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  });

  loadStudent();
</script></body>
  </html>
