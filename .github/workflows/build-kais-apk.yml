name: Build K.AI.S APK

on:
  push:
    branches: [kais-apk]
    paths:
      - 'android/**'
      - '.github/workflows/build-kais-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build K.AI.S debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          stat -c '%n %s bytes' android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload K.AI.S APK
        uses: actions/upload-artifact@v4
        with:
          name: kais-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
