name: Build Master AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/master-ai/**'
      - '.github/workflows/master-ai-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android/master-ai
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kais-master-ai-debug-apk
          path: android/master-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
