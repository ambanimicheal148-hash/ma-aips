name: Build K.AI.S APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: K-AI-S-Android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create kais-v1.0.0 android/app/build/outputs/apk/release/app-release.apk \
            --title "K.AI.S Android 1.0.0" \
            --notes "Public K.AI.S Android client. Master AI is not included in this APK and remains CEO-only." \
            --target "${GITHUB_SHA}" || gh release upload kais-v1.0.0 android/app/build/outputs/apk/release/app-release.apk --clobber
