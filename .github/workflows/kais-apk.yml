name: Build MA.AI.P.S Android Apps

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/kais-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/kais-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kais-apk:
    name: Build K.AI.S APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build K.AI.S debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify K.AI.S APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          test "$(stat -c%s android/app/build/outputs/apk/debug/app-debug.apk)" -gt 100000
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload K.AI.S APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kais-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish K.AI.S APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create kais-v1.0.1 android/app/build/outputs/apk/debug/app-debug.apk \
            --title "K.AI.S Android 1.0.1" \
            --notes "Public K.AI.S Android test/release APK. Master AI is not included." \
            --target "${GITHUB_SHA}" || gh release upload kais-v1.0.1 android/app/build/outputs/apk/debug/app-debug.apk --clobber

  master-ai:
    name: Build MASTER AI War Room APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build MASTER AI debug APK
        working-directory: android
        run: gradle --no-daemon :master:assembleDebug
      - name: Verify MASTER AI APK
        run: |
          test -f android/master/build/outputs/apk/debug/master-debug.apk || test -f android/master/build/outputs/apk/debug/app-debug.apk
          APK=$(find android/master/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
      - name: Upload MASTER AI APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: master-ai-war-room-apk
          path: android/master/build/outputs/apk/debug/*.apk
          if-no-files-found: error
