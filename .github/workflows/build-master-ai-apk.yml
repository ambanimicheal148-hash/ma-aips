name: Build Master AI APK

on:
  push:
    branches: [main]
    paths:
      - 'android/master-ai/**'
      - '.github/workflows/build-master-ai-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android/master-ai
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK payload
        run: |
          file android/master-ai/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/master-ai/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          test "$(stat -c%s android/master-ai/app/build/outputs/apk/debug/app-debug.apk)" -gt 100000
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: master-ai-war-room-apk
          path: android/master-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish verified APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="master-ai-war-room-v1.2.1"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" android/master-ai/app/build/outputs/apk/debug/app-debug.apk \
            --title "MASTER AI War Room v1.2.1" \
            --notes "Verified debug APK for the private MASTER AI War Room. The app opens the live War Room URL and contains no embedded AI provider API keys." \
            --latest
