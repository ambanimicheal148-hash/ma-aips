name: Build Master AI APK

on:
  push:
    branches: [master-ai-apk]
    paths:
      - 'android/master-ai/**'
      - '.github/workflows/build-master-ai-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android/master-ai
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK exists and is a valid ZIP/APK
        run: |
          test -f android/master-ai/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/master-ai/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          stat -c '%n %s bytes' android/master-ai/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: master-ai-war-room-apk
          path: android/master-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
